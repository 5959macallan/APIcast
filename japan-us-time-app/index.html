<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Japan & US Time</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 2rem;
      color: #e94560;
    }

    .clocks {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      max-width: 960px;
      width: 100%;
    }

    .clock-card {
      background: #16213e;
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      border: 1px solid #0f3460;
      transition: transform 0.2s;
    }

    .clock-card:hover {
      transform: translateY(-4px);
    }

    .clock-card.japan {
      border-color: #e94560;
    }

    .flag {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    .city {
      font-size: 1rem;
      color: #aaa;
      margin-bottom: 0.25rem;
    }

    .timezone-label {
      font-size: 0.8rem;
      color: #666;
      margin-bottom: 0.75rem;
    }

    .time {
      font-size: 2.8rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 2px;
    }

    .date {
      font-size: 0.9rem;
      color: #999;
      margin-top: 0.5rem;
    }

    .period {
      font-size: 1rem;
      font-weight: 400;
      color: #e94560;
      margin-left: 4px;
    }

    footer {
      margin-top: 2rem;
      color: #444;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <h1>Japan & US Time Clock</h1>
  <div class="clocks" id="clocks"></div>
  <footer>Updates every second</footer>

  <script>
    const zones = [
      { city: 'Tokyo',        tz: 'Asia/Tokyo',           flag: '\u{1F1EF}\u{1F1F5}', className: 'japan' },
      { city: 'New York',     tz: 'America/New_York',     flag: '\u{1F1FA}\u{1F1F8}', className: '' },
      { city: 'Chicago',      tz: 'America/Chicago',      flag: '\u{1F1FA}\u{1F1F8}', className: '' },
      { city: 'Denver',       tz: 'America/Denver',       flag: '\u{1F1FA}\u{1F1F8}', className: '' },
      { city: 'Los Angeles',  tz: 'America/Los_Angeles',  flag: '\u{1F1FA}\u{1F1F8}', className: '' },
      { city: 'Honolulu',     tz: 'Pacific/Honolulu',     flag: '\u{1F1FA}\u{1F1F8}', className: '' },
    ];

    function formatTime(date, tz) {
      return date.toLocaleTimeString('en-US', {
        timeZone: tz,
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: true,
      });
    }

    function formatDate(date, tz) {
      return date.toLocaleDateString('en-US', {
        timeZone: tz,
        weekday: 'short',
        year: 'numeric',
        month: 'short',
        day: 'numeric',
      });
    }

    function tzAbbr(date, tz) {
      const parts = date.toLocaleTimeString('en-US', {
        timeZone: tz,
        timeZoneName: 'short',
      }).split(' ');
      return parts[parts.length - 1];
    }

    // Build cards
    const container = document.getElementById('clocks');
    zones.forEach((z, i) => {
      const card = document.createElement('div');
      card.className = 'clock-card ' + z.className;
      card.innerHTML = `
        <div class="flag">${z.flag}</div>
        <div class="city">${z.city}</div>
        <div class="timezone-label" id="tz-${i}"></div>
        <div class="time" id="time-${i}"></div>
        <div class="date" id="date-${i}"></div>
      `;
      container.appendChild(card);
    });

    function tick() {
      const now = new Date();
      zones.forEach((z, i) => {
        document.getElementById(`time-${i}`).textContent = formatTime(now, z.tz);
        document.getElementById(`date-${i}`).textContent = formatDate(now, z.tz);
        document.getElementById(`tz-${i}`).textContent = tzAbbr(now, z.tz);
      });
    }

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
